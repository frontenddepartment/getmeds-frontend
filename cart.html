<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,viewport-fit=cover">
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1D9FDA" />
    <title>Your Request List | Getmeds</title>
    <meta name="description"
        content="Products you have saved to request a quote from Getmeds. Held on this device only." />
    <!-- The list lives in this browser's storage and is different for every
         visitor, so there is nothing here for a search engine to index. -->
    <meta name="robots" content="noindex, nofollow" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0D99FF',
                        dark: '#1A202C',
                        footer: '#1A1D2B',
                        unblue: '#00ADEF'
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body data-page="cart" class="bg-white text-gray-800 antialiased">
    <div id="root"></div>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <script type="module" src="/src/entries/cart-entry.tsx"></script>
    <script src="/components/components.js"></script>
</body>

</html>
