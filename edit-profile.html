<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,viewport-fit=cover">
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <title>Edit Profile | Getmeds</title>
    <meta name="robots" content="noindex, nofollow" />

    <!--
      This page is now a redirect to /profile.

      What stood here was a second profile editor, and it was the worse of the
      two: it could change only a display name and a picture, it wrote them to
      a different place than every other detail the app keeps, and its save
      handler was wrapped in `if (currentUser)` — so for anyone who was not
      signed in the button said "Saving..." and then nothing happened at all,
      not even a reset, not even an error.

      Editing your name, picture, contact details and address now all happens
      in one form on /profile, which saves every time. The URL is kept because
      the navbar, the blog and the homepage all still link to it.
    -->
    <link rel="canonical" href="/profile" />
    <meta http-equiv="refresh" content="0; url=/profile#details" />
    <script>
        // Ahead of the meta refresh, and replace() rather than assign() so the
        // back button returns to wherever the visitor actually came from
        // instead of bouncing them through here again.
        location.replace('/profile#details');
    </script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F3F6FB;
            color: #6B7280;
            font: 400 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>

<body>
    <p>Taking you to <a href="/profile#details" style="color:#1D9FDA">your profile</a>&hellip;</p>
</body>

</html>
