<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - GetMEDS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0D99FF',
                        dark: '#1A202C',
                        footer: '#1A1D2B',
                        unblue: '#00ADEF'
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        @keyframes float-up-down {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        .animate-float-1 {
            animation: float-up-down 4s ease-in-out infinite;
        }

        .animate-float-2 {
            animation: float-up-down 5s ease-in-out 1s infinite;
        }

        .animate-float-3 {
            animation: float-up-down 6s ease-in-out 2s infinite;
        }
    </style>
</head>

<body data-page="contact-us" class="bg-white text-gray-800 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/entries/contact-us-entry.tsx"></script>
    <script src="components/components.js"></script>
</body>

</html>
