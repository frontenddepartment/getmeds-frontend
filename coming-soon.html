<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,viewport-fit=cover">
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1D9FDA" />
    <!-- Replaced on load with the specific site's name (see src/pages/coming-soon.tsx). -->
    <title>Coming Soon - Getmeds</title>
    <meta name="description" content="This Getmeds Global Network site is under construction.">
    <!-- Nothing here is worth indexing until the real site exists. -->
    <meta name="robots" content="noindex, follow">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        /* Colour tokens — Getmeds healthcare blue (the logo / theme-color blue). */
        :root {
            --ink: #1A202C;
            --ink-soft: #4A5568;
            --accent: #1D9FDA;
            --accent-dark: #1580B3;
            --maxw: 1180px;
            --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        body {
            margin: 0;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            color: var(--ink);
            background: #ffffff;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            font-weight: 600;
            line-height: 1.12;
            letter-spacing: -0.01em;
        }

        /* ---- The coming-soon page ---- */
        .uc-section {
            display: flex;
            align-items: center;
            min-height: 100vh;
            padding: 64px 0;
            background: #ffffff;
            box-sizing: border-box;
        }

        .uc-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 0.95fr);
            align-items: center;
            gap: 56px;
        }

        .uc-title {
            font-size: clamp(30px, 4vw, 46px);
            line-height: 1.1;
            margin: 0 0 16px;
        }

        .uc-line {
            max-width: 26rem;
            margin: 0 0 32px;
            font-size: 16px;
            line-height: 1.6;
            color: var(--ink-soft);
        }

        .uc-art {
            width: 100%;
            height: auto;
        }

        .uc-gear {
            animation: uc-spin 14s linear infinite;
        }

        .uc-gear--reverse {
            animation-duration: 9s;
            animation-direction: reverse;
        }

        @keyframes uc-spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .uc-gear { animation: none; }
        }

        @media (max-width: 860px) {
            .uc-grid { grid-template-columns: 1fr; gap: 40px; }
            /* Illustration below the message, so the text is never pushed off the fold. */
            .uc-art { order: 2; max-width: 380px; }
        }

        /* ---- Site-wide pieces the page uses ---- */
        .wrap {
            width: 100%;
            max-width: var(--maxw);
            margin: 0 auto;
            padding: 0 32px;
            box-sizing: border-box;
        }

        @media (max-width: 480px) {
            .wrap { padding: 0 20px; }
        }

        .eyebrow {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent-dark);
            margin-bottom: 14px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 22px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s var(--ease);
            border: 1px solid transparent;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }

        .btn:focus-visible {
            outline: 3px solid rgba(29, 159, 218, 0.4);
            outline-offset: 2px;
        }
    </style>
</head>

<!-- Standalone page: no navbar or footer (components.js is deliberately not loaded),
     so the only way onward is the Return Home button. -->
<body data-page="coming-soon">
    <div id="root"></div>
    <script type="module" src="/src/entries/coming-soon-entry.tsx"></script>
</body>

</html>
