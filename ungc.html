<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UN Global Compact - Getmeds</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0D99FF',
                        dark: '#1A202C',
                        footer: '#1A1D2B',
                        unblue: '#00ADEF'
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .hero-shadow-up {
            box-shadow: 0 -40px 60px -20px rgba(0, 0, 0, 0.08);
            position: relative;
            z-index: 10;
        }

        .sdg-pill {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            border-radius: 9999px;
            background: white;
            border: 1px solid #e5e7eb;
            font-size: 13px;
            font-weight: 500;
            color: #4b5563;
            transition: all 0.3s ease;
        }

        .sdg-pill:hover {
            border-color: #0D99FF;
            color: #0D99FF;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13, 153, 255, 0.1);
        }
    </style>
</head>

<body data-page="ungc" class="bg-white text-gray-800 antialiased">
    <div id="root"></div>
