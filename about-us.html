<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us - GetMEDS</title>
    <meta name="description"
        content="Learn more about GetMEDS, your trusted companion in health and wellness. Discover our mission, vision, and the team behind our platform.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0D99FF',
                        dark: '#1A202C',
                        footer: '#1A1D2B',
                        success: '#5ab04c',
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .reveal {
            transform: translateY(30px);
            opacity: 0;
            transition: all 0.8s ease-out;
        }

        .reveal.active {
            transform: translateY(0);
            opacity: 1;
        }

        .text-gradient {
            background: linear-gradient(135deg, #61A644, #1D9FDA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge-pill {
            background: linear-gradient(135deg, rgba(97, 166, 68, .12), rgba(29, 159, 218, .12));
            border: 1px solid rgba(29, 159, 218, .2);
            color: #1D9FDA;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% center
            }

            100% {
                background-position: 200% center
            }
        }

        .btn-gradient {
            background: linear-gradient(90deg, #61A644, #1D9FDA, #61A644);
            background-size: 200% auto;
            transition: background-position .5s ease, box-shadow .3s ease;
        }

        .btn-gradient:hover {
            background-position: right center;
            box-shadow: 0 8px 24px rgba(29, 159, 218, .4);
        }

        /* Executive Team New Design */
        .team-card {
            position: relative;
            height: 400px;
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 1.5rem;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .team-card:hover {
            transform: translateY(-10px);
        }

        .team-ribbon {
            position: absolute;
            top: 0;
            left: 0;
            width: 70px;
            height: 90%;
            background: linear-gradient(180deg, #61A644, #1D9FDA);
            border-radius: 1.5rem 0 1.5rem 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.95;
        }

        .vertical-text {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            color: rgba(255, 255, 255, 0.2);
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            white-space: nowrap;
            user-select: none;
        }

        .team-img-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .team-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            border-radius: 1.5rem;
        }

        .team-content {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 40px 20px 20px 20px;
            z-index: 10;
            pointer-events: none;
            background: linear-gradient(to top, rgba(29, 159, 218, 0.95) 0%, rgba(97, 166, 68, 0.1) 70%, transparent 100%);
        }

        .team-name {
            font-size: 1.2rem;
            font-weight: 800;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 2px;
            line-height: 1.2;
        }

        .team-role {
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .team-social {
            position: absolute;
            top: 30px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 20;
            opacity: 0;
            transform: translateX(20px);
            transition: all 0.4s ease;
        }

        .team-card:hover .team-social {
            opacity: 1;
            transform: translateX(0);
        }

        .value-card {
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
            animation: float-slow 6s ease-in-out infinite;
        }

        .value-card:hover {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            z-index: 30;
        }

        @keyframes float-slow {
            0%,
            100% {
                transform: translateY(0) rotate(0);
            }

            50% {
                transform: translateY(-20px) rotate(1deg);
            }
        }

        .value-card:nth-child(even) {
            animation-duration: 8s;
            animation-delay: -2s;
        }
    </style>
</head>

<body data-page="about-us" class="bg-white text-gray-800 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/entries/about-us-entry.tsx"></script>
    <script src="components/components.js"></script>
</body>

</html>
