<body class="bg-[#F8FAFC] text-gray-800 antialiased flex flex-col min-h-screen">

        <!-- Abstract Background Gradients -->
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary/10 rounded-full blur-3xl -z-10 animate-pulse"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-secondary/10 rounded-full blur-3xl -z-10 animate-pulse"

        <div class="relative z-10 flex flex-col items-center max-w-lg mx-auto">
            <!-- 404 Animated Typography -->
            <div class="relative mb-4">
                <h1
                    class="text-[120px] md:text-[160px] font-black leading-none gradient-text tracking-tighter select-none">
                    404</h1>
                <div
                    class="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-dark text-white text-xs font-bold px-4 py-1.5 rounded-full uppercase tracking-widest shadow-md">

                </div>
            </div>

                </a>
                <a href="/cancer-medicines"
                    class="bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 font-semibold py-3.5 px-8 rounded-full transition-all duration-300 custom-glow hover:-translate-y-0.5 text-base flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-magnifying-glass text-primary"></i> <span>Search Medicines</span>
                </a>
            </div>
        </div>
