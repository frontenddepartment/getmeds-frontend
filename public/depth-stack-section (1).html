<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depth Stack Section</title>
<style>
  body{margin:0;background:#101014}

  /* ===== Depth Stack section — copy from here ===== */
  .depth-stack{
    position:relative;
    width:100%;
    aspect-ratio:3 / 1;       /* wide and short; use 21 / 9 for a bit taller */
    min-height:280px;
    max-height:60vh;
    overflow:hidden;
    background:#101014;
  }
  .depth-stack canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* ===== to here ===== */
</style>
</head>
<body>

<!-- Depth Stack section -->
<section class="depth-stack" id="depthStack">
  <canvas></canvas>
</section>

<script>
(() => {
  /* ---------- SETTINGS ---------- */
  const CONFIG = {
    // Put your image URLs here. Leave empty to show placeholder cards.
    images: [
      // 'images/work-01.jpg',
      // 'images/work-02.jpg',
    ],
    background: '#101014',
    cardCount: 18,
    cardSize: 0.42,       // card height as a share of the section height (far-plane reference)
    loopSeconds: 16,      // time for one full pass
    depth: 2.4,           // how deep the stack goes
    depthFade: 0.45,      // 0 = no fade, 1 = far cards blend fully into background
    cornerRadius: 0.03,   // share of card width
    shadow: true,
    direction: 1          // 1 = toward viewer, -1 = away
  };

  const section = document.getElementById('depthStack');
  const cvs = section.querySelector('canvas');
  const ctx = cvs.getContext('2d');

  /* seeded random so the layout is the same on every load */
  function rng(seed){ return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  /* ---------- images (or placeholders) ---------- */
  function placeholders(){
    const out = [], shapes = [[4,3],[3,4],[1,1],[16,10],[4,5]];
    for (let i = 0; i < 12; i++){
      const [a,b] = shapes[i % shapes.length], w = 480, h = Math.round(480*b/a);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'), hue = (i*47 + 200) % 360;
      const grd = g.createLinearGradient(0,0,w,h);
      grd.addColorStop(0, `hsl(${hue} 55% 58%)`); grd.addColorStop(1, `hsl(${(hue+50)%360} 60% 28%)`);
      g.fillStyle = grd; g.fillRect(0,0,w,h);
      const r = rng(i+11);
      for (let k = 0; k < 5; k++){ g.fillStyle = `hsla(${(hue+r()*90)%360} 70% ${50+r()*30}% / .35)`; g.beginPath(); g.arc(r()*w, r()*h, 30+r()*120, 0, Math.PI*2); g.fill(); }
      out.push(c);
    }
    return out;
  }
  let sources = placeholders();
  if (CONFIG.images.length){
    const loaded = [];
    CONFIG.images.forEach((src, i) => {
      const img = new Image(); img.decoding = 'async';
      img.onload = () => { loaded[i] = img; const ok = loaded.filter(Boolean); if (ok.length) sources = ok; };
      img.src = src;
    });
  }
  const sw = s => s.naturalWidth || s.width, sh = s => s.naturalHeight || s.height;

  /* ---------- evenly scattered layout ----------
     Cards get cells on a jittered grid (shuffled), so neighbours in depth
     land far apart on screen and nothing bunches in the middle. */
  function buildLayout(N){
    // R2 low-discrepancy sequence: points fill the area evenly and
    // consecutive cards (neighbours in depth) land far apart.
    const a1 = 0.7548776662, a2 = 0.5698402910, rand = rng(1234);
    return Array.from({length:N}, (_, i) => {
      const u = (0.5 + a1*i) % 1, v = (0.5 + a2*i) % 1;
      let x = u*2 - 1, y = v*2 - 1;
      // nudge away from the dead centre so far cards don't pile up there
      const r = Math.hypot(x, y) || 1e-3, nr = 0.3 + 0.7*r;
      x = Math.max(-1, Math.min(1, (x / r) * nr + (rand()-0.5)*0.08));
      y = Math.max(-1, Math.min(1, (y / r) * nr + (rand()-0.5)*0.08));
      return { x: x * 1.55, y: y * 1.35 };
    });
  }
  const layout = buildLayout(CONFIG.cardCount);

  /* ---------- drawing ---------- */
  const smooth = (a,b,v) => { const t = Math.min(1, Math.max(0, (v-a)/(b-a))); return t*t*(3-2*t); };
  function roundRect(x,y,w,h,r){ r = Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  const hex = h => { const n = parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; };
  const [br,bgc,bb] = hex(CONFIG.background);

  function render(p){
    const W = cvs.width, H = cvs.height;
    ctx.fillStyle = CONFIG.background; ctx.fillRect(0,0,W,H);

    const N = CONFIG.cardCount, zNear = 0.45, zFar = zNear + CONFIG.depth;
    const cards = [];
    for (let i = 0; i < N; i++){
      const d = ((i/N + p*CONFIG.direction) % 1 + 1) % 1;  // 0 far → 1 at camera
      cards.push({ i, d, z: zFar - d*(zFar - zNear) });
    }
    cards.sort((a,b) => b.z - a.z);

    for (const c of cards){
      const alpha = smooth(0, 0.12, c.d) * (1 - smooth(0.86, 1, c.d));
      if (alpha < 0.003) continue;
      const src = sources[c.i % sources.length], ar = sw(src)/sh(src);
      const s = 1 / c.z;
      let ch = CONFIG.cardSize * H * s, cw = ch * ar;
      if (ar > 1.4){ cw = CONFIG.cardSize * H * s * 1.4; ch = cw / ar; }
      const L = layout[c.i];
      const px = W/2 + L.x * (W/2) * s;
      const py = H/2 + L.y * (H/2) * s;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(px, py);
      const rad = CONFIG.cornerRadius * cw;
      if (CONFIG.shadow){
        ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 0.12*cw; ctx.shadowOffsetY = 0.04*cw;
        roundRect(-cw/2,-ch/2,cw,ch,rad); ctx.fillStyle = CONFIG.background; ctx.fill();
        ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      }
      roundRect(-cw/2,-ch/2,cw,ch,rad); ctx.clip();
      const ia = sw(src)/sh(src); let dw = cw, dh = cw/ia; if (dh < ch){ dh = ch; dw = ch*ia; }
      ctx.drawImage(src, -dw/2, -dh/2, dw, dh);
      const f = CONFIG.depthFade * Math.pow(1 - c.d, 1.1);
      if (f > 0){ ctx.fillStyle = `rgba(${br},${bgc},${bb},${Math.min(1,f)})`; ctx.fillRect(-cw/2,-ch/2,cw,ch); }
      ctx.restore();
    }
  }

  /* ---------- sizing (sharp on retina) ---------- */
  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cvs.width = Math.round(section.clientWidth * dpr);
    cvs.height = Math.round(section.clientHeight * dpr);
  }
  new ResizeObserver(resize).observe(section);
  resize();

  /* ---------- loop: pauses when off-screen ---------- */
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let visible = true, last = performance.now(), t = 0;
  new IntersectionObserver(([e]) => { visible = e.isIntersecting; last = performance.now(); }).observe(section);
  function tick(now){
    if (visible && !reduce) t += (now - last) / 1000;
    last = now;
    render((t / CONFIG.loopSeconds) % 1);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
