<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSR - GetMEDS</title>
    <meta name="description"
        content="Corporate Social Responsibility at GetMeds. Our mission to make healthcare accessible through partnerships and patient advocacy.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0D99FF',
                        dark: '#1A202C',
                        footer: '#1A1D2B',
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        /* Scroll Reveal Effect */
        .reveal {
            transform: translateY(30px);
            opacity: 0;
            transition: all 0.8s ease-out;
        }

        .reveal.active {
            transform: translateY(0);
            opacity: 1;
        }

        /* Gallery Slider */
        .gallery-container {
            position: relative;
            height: 480px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .gallery-item {
            position: absolute;
            left: 50%;
            top: 50%;
            transition: all 0.9s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border-radius: 1.5rem;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .pos-0 {
            transform: translate(-50%, -50%) translateX(-420px) scale(1);
            opacity: 0.3;
            z-index: 10;
            width: 190px;
            height: 260px;
        }

        .pos-1 {
            transform: translate(-50%, -50%) translateX(-230px) scale(1);
            opacity: 0.7;
            z-index: 20;
            width: 220px;
            height: 320px;
        }

        .pos-2 {
            transform: translate(-50%, -50%) translateX(0) scale(1);
            opacity: 1;
            z-index: 30;
            width: 280px;
            height: 420px;
            box-shadow: 0 40px 80px -15px rgba(0, 0, 0, 0.3);
        }

        .pos-3 {
            transform: translate(-50%, -50%) translateX(230px) scale(1);
            opacity: 0.7;
            z-index: 20;
            width: 220px;
            height: 320px;
        }

        .pos-4 {
            transform: translate(-50%, -50%) translateX(420px) scale(1);
            opacity: 0.3;
            z-index: 10;
            width: 190px;
            height: 260px;
        }

        @media (max-width: 1024px) {
            .pos-0 {
                transform: translate(-50%, -50%) translateX(-300px) scale(0.8);
                opacity: 0.1;
            }

            .pos-1 {
                transform: translate(-50%, -50%) translateX(-180px) scale(0.9);
            }

            .pos-3 {
                transform: translate(-50%, -50%) translateX(180px) scale(0.9);
            }

            .pos-4 {
                transform: translate(-50%, -50%) translateX(300px) scale(0.8);
                opacity: 0.1;
            }
        }

        @media (max-width: 768px) {
            .gallery-container {
                height: 400px;
            }

            .pos-0,
            .pos-4 {
                opacity: 0;
                visibility: hidden;
            }

            .pos-1 {
                transform: translate(-50%, -50%) translateX(-120px) scale(0.8);
                opacity: 0.5;
            }

            .pos-3 {
                transform: translate(-50%, -50%) translateX(120px) scale(0.8);
                opacity: 0.5;
            }

            .pos-2 {
                width: 220px;
                height: 340px;
            }
        }

        @media (max-width: 480px) {
            .pos-1 {
                transform: translate(-50%, -50%) translateX(-100px) scale(0.7);
                opacity: 0.3;
            }

            .pos-3 {
                transform: translate(-50%, -50%) translateX(100px) scale(0.7);
                opacity: 0.3;
            }
        }

        /* Assist 3D Slider */
        .assist-card[data-pos="0"] {
            transform: translate3d(0, 0, 0) scale(1) rotateY(0deg);
            z-index: 30;
            opacity: 1;
        }

        .assist-card[data-pos="1"] {
            transform: translate3d(45%, 0, -250px) scale(0.85) rotateY(-35deg);
            z-index: 20;
            opacity: 0.6;
        }

        .assist-card[data-pos="-1"] {
            transform: translate3d(-45%, 0, -250px) scale(0.85) rotateY(35deg);
            z-index: 20;
            opacity: 0.6;
        }

        @media (max-width: 768px) {
            .assist-card[data-pos="1"] {
                transform: translate3d(35%, 0, -150px) scale(0.8) rotateY(-25deg);
            }

            .assist-card[data-pos="-1"] {
                transform: translate3d(-35%, 0, -150px) scale(0.8) rotateY(25deg);
            }
        }

        /* Pink Run 3D Slider */
        .pink-card[data-pos="0"] {
            transform: translate3d(0, 0, 0) scale(1) rotateY(0deg);
            z-index: 30;
            opacity: 1;
        }

        .pink-card[data-pos="1"] {
            transform: translate3d(45%, 0, -250px) scale(0.85) rotateY(-40deg);
            z-index: 20;
            opacity: 0.6;
        }

        .pink-card[data-pos="-1"] {
            transform: translate3d(-45%, 0, -250px) scale(0.85) rotateY(40deg);
            z-index: 20;
            opacity: 0.6;
        }
    </style>
</head>

<body data-page="csr" class="bg-white text-gray-800 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/entries/csr-entry.tsx"></script>
</body>

</html>
