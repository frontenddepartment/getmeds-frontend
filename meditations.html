<head>
    <meta charset="UTF-8" />

    <meta name="description"
        content="Nurture your Mind, Body & Soul. Experience the Getmeds Meditation App with interactive breathing guides and live ambient soundscapes." />

    <meta property="og:url" content="https://getmeds.ph/meditations">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0D99FF',
                        secondary: '#4A5568',
                        dark: '#1A202C',
                        footer: '#1A1D2B',
                        cardbg: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        /* Override navbar background to blend with hero section on this page only */
        #navbar-container nav {
            border-bottom: none !important;
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Animated equalizing waves */
        .equalizer-wave {
            display: flex;
            align-items: flex-end;
            gap: 2.5px;
            height: 30px;
        }

        .equalizer-bar {
            width: 3px;
            height: 10%;
            background: linear-gradient(to top, #61A644, #1D9FDA);
            border-radius: 3px;
            transition: height 0.15s ease-in-out;
        }

        .equalizer-bar.active {
            animation: bounce-bar 1.2s ease-in-out infinite alternate;
        }

        @keyframes bounce-bar {
            0% { height: 10%; }
            100% { height: 100%; }
        }

        /* Custom breathing ring pulsing animation */
        @keyframes breathe-in-out {
            0%, 100% {
                transform: scale(0.9);
                opacity: 0.45;
                box-shadow: 0 0 10px rgba(97, 166, 68, 0.2), 0 0 20px rgba(29, 159, 218, 0.1);
            }
            50% {
                transform: scale(1.15);
                opacity: 0.95;
                box-shadow: 0 0 25px rgba(97, 166, 68, 0.4), 0 0 50px rgba(29, 159, 218, 0.3);
            }
        }

        .pulse-breathing-active {
            animation: breathe-in-out 4s ease-in-out infinite;
        }

        /* Hide scrollbars */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <script type="application/ld+json">

}

</head>
