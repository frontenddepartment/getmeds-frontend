<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,viewport-fit=cover">
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1D9FDA" />
    <title>Business card | Getmeds</title>
    <meta name="description" content="A Getmeds business card. Save the contact, or message them on WhatsApp or Viber." />
    <!-- These pages carry named staff members' mobile numbers. They are meant
         to be reachable by whoever is holding the printed card and by nobody
         running a search, and the robots meta is the only thing that draws
         that line. The X-Robots-Tag header in vercel.json says the same thing
         to a crawler that never parses the HTML. -->
    <meta name="robots" content="noindex, nofollow" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0D99FF',
                        dark: '#1A202C',
                        footer: '#1A1D2B',
                        unblue: '#00ADEF'
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<!-- Tinted ground set here rather than from the React tree, so it paints with
     the shell instead of flashing white first. -->
<body data-page="business-card" style="background:#F3F6FB" class="text-gray-800 antialiased">
    <div id="root"></div>

    <script type="module" src="/src/entries/business-card-entry.tsx"></script>
    <script src="/components/components.js"></script>
</body>

</html>
