<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Services - GetMEDS | Revolutionizing Healthcare Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0D99FF',
                        dark: '#1A202C',
                        accent: '#61A644'
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .text-gradient {
            background: linear-gradient(135deg, #61A644, #1D9FDA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Service card hover */
        .service-card {
            transition: transform 0.35s cubic-bezier(.22, .68, 0, 1.2), box-shadow 0.35s ease;
        }

        .service-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 60px -12px rgba(13, 153, 255, 0.18);
        }

        .service-card:hover .svc-icon {
            transform: scale(1.12) rotate(6deg);
        }

        .svc-icon {
            transition: transform 0.35s cubic-bezier(.22, .68, 0, 1.2);
        }

        /* Stat counter */
        .stat-item {
            border-right: 1px solid rgba(255, 255, 255, 0.15);
        }

        .stat-item:last-child {
            border-right: none;
        }

        /* Scroll Reveal Effect */
        .reveal {
            transform: translateY(30px);
            opacity: 0;
            transition: all 0.8s ease-out;
        }

        .reveal.active {
            transform: translateY(0);
            opacity: 1;
        }

        /* FAQ accordion */
        .faq-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease;
        }

        .faq-body.open {
            max-height: 300px;
        }

        .faq-chevron {
            transition: transform 0.3s ease;
        }

        .faq-item.open .faq-chevron {
            transform: rotate(180deg);
        }

        /* Process step connector */
        .step-line {
            background: linear-gradient(to bottom, #1D9FDA, #61A644);
        }

        /* Floating card bounce */
        @keyframes float {
            0%,
            100% {
                transform: translateY(-8px)
            }

            50% {
                transform: translateY(0)
            }
        }

        .animate-float {
            animation: float 3.5s ease-in-out infinite;
        }

        /* Gradient icon backgrounds */
        .icon-blue {
            background: linear-gradient(135deg, #dbeafe, #bfdbfe);
            color: #1D9FDA;
        }

        .icon-green {
            background: linear-gradient(135deg, #dcfce7, #bbf7d0);
            color: #61A644;
        }

        .icon-purple {
            background: linear-gradient(135deg, #f3e8ff, #e9d5ff);
            color: #9333ea;
        }

        .icon-orange {
            background: linear-gradient(135deg, #ffedd5, #fed7aa);
            color: #ea580c;
        }

        .icon-teal {
            background: linear-gradient(135deg, #ccfbf1, #99f6e4);
            color: #0d9488;
        }

        .icon-rose {
            background: linear-gradient(135deg, #ffe4e6, #fecdd3);
            color: #e11d48;
        }

        .badge-pill {
            background: linear-gradient(135deg, rgba(97, 166, 68, .12), rgba(29, 159, 218, .12));
            border: 1px solid rgba(29, 159, 218, .2);
            color: #1D9FDA;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% center
            }

            100% {
                background-position: 200% center
            }
        }

        .btn-gradient {
            background: linear-gradient(90deg, #61A644, #1D9FDA, #61A644);
            background-size: 200% auto;
            transition: background-position .5s ease, box-shadow .3s ease;
        }

        .btn-gradient:hover {
            background-position: right center;
            box-shadow: 0 8px 24px rgba(29, 159, 218, .4);
        }
    </style>
</head>

<body data-page="services" class="bg-white text-gray-800 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/entries/services-entry.tsx"></script>
    <script src="components/components.js"></script>
</body>

</html>
